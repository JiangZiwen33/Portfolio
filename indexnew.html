<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071013">
  <meta name="description" content="黄诗敏 2026 视频作品集">
  <title>黄诗敏 — 2026 视频作品集</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="portfolio-page">
  <aside class="global-directory">
    <nav class="work-directory" aria-label="视频目录">
      <div class="directory-credit">黄诗敏-2026视频作品集</div>
      <div class="work-directory__heading">视频目录</div>
      <div class="work-directory__list" id="video-directory"></div>
    </nav>
  </aside>

  <div class="modal" id="video-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <button class="modal__backdrop" id="modal-backdrop" aria-label="关闭播放器"></button>
    <div class="modal__panel">
      <header class="modal__header">
        <div class="modal__counter" id="modal-counter"></div>
        <button class="modal__close" id="modal-close"><span>关闭</span><span aria-hidden="true">×</span></button>
      </header>
      <div class="modal__player-wrap">
        <video class="modal__player" id="modal-player" controls playsinline>当前浏览器无法播放该视频。</video>
        <iframe class="modal__bilibili" id="modal-bilibili" title="B站视频播放器" allow="autoplay; fullscreen" allowfullscreen hidden></iframe>
        <iframe class="modal__pdf" id="modal-pdf" title="作品集PDF预览" hidden></iframe>
      </div>
      <div class="modal__details">
        <div><span class="modal__eyebrow" id="modal-eyebrow"></span><h2 id="modal-title"></h2></div>
        <p id="modal-description"></p>
      </div>
      <footer class="modal__footer">
        <button id="modal-previous"><span aria-hidden="true">←</span> 上一个</button>
        <div id="modal-meta"></div>
        <button id="modal-next">下一个 <span aria-hidden="true">→</span></button>
      </footer>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
